[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxdeck"
version = "0.2.1"
description = "Dynamic terminal state renderer using Rich"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "rich"
]

authors = [
    { name = "Gideon Wamalwa" ,email="bond8865@gmail.com"}
]

license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
